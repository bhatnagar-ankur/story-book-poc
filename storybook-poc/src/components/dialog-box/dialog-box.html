<storybook-button variant="danger" (click)="openDialog()">
  Delete
</storybook-button>

@if (isOpen) {
<div class="dialog-backdrop">
  <div class="dialog">

    <div class="dialog-header">
      <h3 class="dialog-title">{{title}}</h3>
    </div>

    <div class="dialog-body">
      <p class="dialog-message">
        {{message}} </p>
    </div>

    <div class="dialog-footer">
      <storybook-button variant="secondary" (click)="closeDialog()">
        Cancel
      </storybook-button>

      <storybook-button variant="danger" (click)="confirmDelete()">
        Delete
      </storybook-button>
    </div>
  </div>
</div>
}
