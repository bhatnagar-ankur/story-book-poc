<div class="field-wrapper" [ngClass]="{
        disabled: disabled,
        error: !!error,
        readonly: readonly,
        focused: isFocused || value
     }">
    <label class="field-label" [ngClass]="size">
        {{ label }}
        @if(required){
        <span>*</span>
        }
    </label>
    <div>
        <input class="field-input" [(ngModel)]="value" [placeholder]="placeholder" [disabled]="disabled"
            [readonly]="readonly" [required]="required" (focus)="isFocused = true" (blur)="isFocused = false" />
        @if(error){
        <p class="error-text">{{ error }}</p>
        }
    </div>
</div>
