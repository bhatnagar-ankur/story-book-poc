<div class="ms-wrapper" [ngClass]="{
    disabled: disabled,
    error: !!error,
    readonly: readonly,
    focused: isOpen || !!selected
  }" (click)="toggleDropdown()">
  <label class="ms-label">
    {{ label }}
    @if (required) {
    <span>*</span>
    }
  </label>

  <div class="ms-control">
    <div class="selected-list">
      @if (!selected && focused) {
      <span class="placeholder">{{ placeholder }}</span>
      }

      @if (selected) {
      <span class="single-value full-value">
        {{ selected }}
      </span>
      }

    </div>

    @if (!readonly) {
    <div class="arrow" [ngClass]="{ open: isOpen }">
      <img src="assets/icons/dropdown.svg" />
    </div>
    }
  </div>
</div>

@if (error) {
<p class="error-text">{{ error }}</p>
}

@if (isOpen && !disabled && !readonly) {
<div class="dropdown">
  @for (opt of options; track opt) {
  <div class="option" (click)="select(opt); $event.stopPropagation()" [ngClass]="{ selected: selected === opt }">
    <app-tooltip [label]="truncate(opt)" [text]="opt" position="right">
      <span class="option-text truncate-text">
        {{ truncate(opt) }}
      </span>
    </app-tooltip>
  </div>

  } @empty {
  <div class="no-options">No results found</div>
  }
</div>
}
