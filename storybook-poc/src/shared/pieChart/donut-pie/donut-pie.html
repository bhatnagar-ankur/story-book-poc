<div class="main-donut">
    <div class="donut-chart" [style.width.px]="size" [style.height.px]="size">
        <svg [attr.width]="size" [attr.height]="size" [attr.viewBox]="'0 0 ' + size + ' ' + size">
            @for (seg of segments; track $index) {
            <g class="donut-slice">
                <path [attr.d]="getArcPath(getStart($index), getAngle(seg.value))" [attr.fill]="seg.color"
                    stroke="rgba(0,0,0,0)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />

            </g>
            }
        </svg>
        <div class="donut-center">
            <svg class="donut-dotted" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" fill="none" stroke="#ff8c5a" stroke-width="0.6" stroke-dasharray="1 6"
                    stroke-linecap="round" />
            </svg>
            <div class="donut-arrows">
                <span>↑</span>
                <span>↓</span>
            </div>
        </div>
    </div>
</div>
