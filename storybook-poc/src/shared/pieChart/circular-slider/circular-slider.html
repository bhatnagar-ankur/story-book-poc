<div class="main-circularSlider">
    <div class="circular-slider-wrapper">
        <svg [attr.width]="size" [attr.height]="size" [attr.viewBox]="'0 0 ' + size + ' ' + size"
            (mousedown)="onCircleDown($event)" (mousemove)="onCircleMove($event)" (mouseup)="onCircleUp()"
            (mouseleave)="onCircleUp()">
            <defs>
                <linearGradient id="sliderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#3B82F6" />
                    <stop offset="50%" stop-color="#22C55E" />
                    <stop offset="100%" stop-color="#7DD3FC" />
                </linearGradient>
            </defs>
            <circle [attr.cx]="size/2" [attr.cy]="size/2" [attr.r]="sliderRadius" class="slider-bg" />
            <circle [attr.cx]="size/2" [attr.cy]="size/2" [attr.r]="sliderRadius" class="slider-full"
                stroke="url(#sliderGrad)" />
            <circle [attr.cx]="sliderDot.x" [attr.cy]="sliderDot.y" r="7" class="slider-knob" />
            <text [attr.x]="size/2" [attr.y]="size/2 + 10" text-anchor="middle" class="slider-text">
                {{ sliderValue }} lm
            </text>
        </svg>
        <input type="range" class="slider-range" [min]="min" [max]="max" [(ngModel)]="sliderValue" />
        <div class="slider-scale">
            <span>0%</span>
            <span>100%</span>
        </div>
    </div>
</div>
