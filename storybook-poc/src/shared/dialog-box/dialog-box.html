<div class="dialog" [ngClass]="[variant, size, position]">
    <div class="header">
        <span class="icon"></span>
        <h2>{{ title }}</h2>
        <button class="close-btn" (click)="closeCancel()">
            <img src="./assets/icons/close.svg" class="close-img" />
        </button>
    </div>

    <div class="body">
        <p>{{ message }}</p>
    </div>

    <div class="footer">
        <app-buttons label="CANCEL" buttonType="text" (click)="closeCancel()"></app-buttons>
        <app-buttons label="Okay" buttonType="primary" (click)="closeConfirm()"></app-buttons>
    </div>
</div>
