<div class="badge-card" [ngClass]="variant">
    @if (variant === 'counter') {
    <div class="pill" [ngClass]="[size, color]" [style.background]="color === 'custom' ? customColor : null">
        <span>+</span>
        <span>{{ count }}</span>
    </div>
    }
    @if (variant === 'status') {
    <div class="icon" [ngClass]="color" [style.background-color]="color === 'custom' ? customColor : null">
        @if (customIcon) {
        <img [src]="customIcon" alt="status icon" />
        }
    </div>
    }
</div>
