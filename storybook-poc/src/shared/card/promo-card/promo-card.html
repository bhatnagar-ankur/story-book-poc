<div class="promo-card">
    <div class="promo-left">
        <img [src]="image" alt="" />
    </div>
    <div class="promo-right">
        <h2 class="promo-title">{{ title }}</h2>
        <div class="promo-divider"></div>
        <p>{{ description }}</p>
        <app-buttons class="cta" label="LEARN MORE" buttonType="iconic" size="medium" icon="./assets/icons/dropdown.svg"
            iconPosition="right">
        </app-buttons>
    </div>
</div>
