<label class="cb-root">
    <input type="checkbox" class="cb-input" [checked]="checked" [indeterminate]="indeterminate"
        (change)="onChange($event)" />
    <span class="cb-box">
        <!-- Check -->
        <svg class="cb-check" viewBox="0 0 24 24">
            <path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        <!-- Indeterminate -->
        <svg class="cb-partial" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
        </svg>
    </span>
    @if (label) {
    <span class="cb-label">{{ label }}</span>
    }
</label>
