@if (variant === 'default') {
<div class="default-toggle-wrapper">
  <label class="toggle-wrapper">
    <input type="checkbox" class="toggle-input" [checked]="checked" [disabled]="disabled" (change)="onToggle()" />
    <span class="toggle-slider"></span>
  </label>
  @if (showText) {
  <span class="toggle-text">
    {{ text }}
  </span>
  }
</div>
}

@if (variant === 'iconic') {
<div class="iconic-toggle" [class.disabled]="disabled">

  <button class="icon-btn" [class.active]="checked" (click)="setValue(true)" [disabled]="disabled">
    <img src="assets/icons/table.svg" alt="check" />
    @if (showText) {
    <span class="icon-text">Table</span>
    } </button>

  <button class="icon-btn" [class.active]="!checked" (click)="setValue(false)" [disabled]="disabled">
    <img src="assets/icons/gallery.svg" alt="close" />
    @if (showText) {
    <span class="icon-text">Gallery</span>
    } </button>

</div>
}
