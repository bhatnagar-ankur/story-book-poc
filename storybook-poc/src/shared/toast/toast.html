<div class="toast" [ngClass]="variant">
    <div class="side"></div>

    <div class="content">
        <strong class="content-title">{{ title }}</strong>
        <p><strong class="content-subtitle">{{ subTitle }}</strong> {{ message }}</p>
    </div>

    <button class="close-btn">
        <img src="/assets/icons/close-button.svg" />
    </button>
</div>
