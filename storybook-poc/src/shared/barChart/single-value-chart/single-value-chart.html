<div class="chart-card singleValue">
    <div class="chart">
        @for (val of values; track $index) {
        <div class="bar-wrapper">
            <div class="delta">
                {{ getDelta(val) }}
            </div>
            <div class="track">
                <div class="fill" [style.height]="getHeight(val)"></div>
            </div>
            <div class="x-label">
                {{ labels[$index] }}
            </div>
        </div>
        }
    </div>
</div>
